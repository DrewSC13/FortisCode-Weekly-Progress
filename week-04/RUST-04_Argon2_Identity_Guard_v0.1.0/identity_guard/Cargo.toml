[package]
name = "identity_guard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"

# Argon2id (RustCrypto)
argon2 = "0.5"
password-hash = "0.5"

# RNG seguro para generar salt (OsRng)
rand = "0.8"

# API
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }