name: ghost-provisioner

services:
  db:
    image: postgres:16-alpine
    container_name: gp_db
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ghostnet
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost_change_me
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghostnet -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    shm_size: 64mb
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 512m
    cpus: "0.75"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  cache:
    image: redis:7-alpine
    container_name: gp_cache
    restart: unless-stopped
    networks:
      - backend_net
    # Redis interno + password (evita cortes por protected-mode)
    command:
      [
        "redis-server",
        "--bind", "0.0.0.0",
        "--protected-mode", "yes",
        "--requirepass", "ghost_cache_change_me",
        "--save", "",
        "--appendonly", "no"
      ]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ghost_cache_change_me", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /data:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 256m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: gp_gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

    networks:
      - frontend_net
      - backend_net

    ports:
      - "8080:8080"

    environment:
      RUST_LOG: info
      APP_BIND: 0.0.0.0:8080
      POSTGRES_DSN: postgres://ghost:ghost_change_me@db:5432/ghostnet
      REDIS_DSN: redis://:ghost_cache_change_me@cache:6379

    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    healthcheck:
      test: ["CMD", "/app/ghost_provisioner", "self-check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

    mem_limit: 256m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  pg_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true