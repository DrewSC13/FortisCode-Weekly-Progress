[package]
name = "ghost_provisioner"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-postgres = "0.7"
redis = { version = "0.25", features = ["tokio-comp"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }